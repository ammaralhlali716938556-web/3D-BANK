<svg viewBox="0 0 40 40" class="svg-3d" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roofL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roofR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="dropSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Base Shadow -->
  <ellipse cx="20" cy="34" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
  <!-- Chimney -->
  <polygon points="23,9 27,11 27,17 23,15" fill="#b91c1c"/>
  <polygon points="27,11 29,10 29,16 27,17" fill="#991b1b"/>
  <polygon points="23,9 25,8 29,10 27,11" fill="#f87171"/>
  <!-- Walls -->
  <polygon points="8,22 20,28 20,33 8,27" fill="url(#wallL)"/>
  <polygon points="20,28 32,22 32,27 20,33" fill="url(#wallR)"/>
  <!-- Door -->
  <polygon points="12,25 16,27 16,31 12,29" fill="#78350f"/>
  <!-- Window -->
  <polygon points="23,25 28,22 28,25 23,28" fill="#38bdf8"/>
  <polygon points="23,25 28,22 28,23 23,26" fill="#bae6fd"/>
  <!-- Roof Left -->
  <polygon points="20,10 8,19 8,22 20,13" fill="url(#roofL)" filter="url(#dropSh)"/>
  <!-- Roof Right -->
  <polygon points="20,10 20,13 32,22 32,19" fill="url(#roofR)"/>
  <!-- Ridge line highlight -->
  <line x1="20" y1="10" x2="20" y2="13" stroke="#a7f3d0" stroke-width="1"/>
</svg>