name: Build Monopoly Game APK

on:
  workflow_dispatch: # تشغيل يدوي بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: إعداد بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: إعداد حزمة أندرويد وتغليف اللعبة
        run: |
          # 1. تهيئة حزمة npm
          npm init -y
          
          # 2. تثبيت Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. إعداد إعدادات اللعبة
          npx cap init "Bank El Hazz" "com.bank.elhazz.game" --web-dir .
          
          # 4. بناء منصة أندرويد
          npx cap add android
          npx cap copy android

      - name: تصدير ملف APK التجريبي
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: رفع ملف الـ APK للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: Bank-ElHazz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
